name: Backend Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MtdrSpring/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Checkstyle
        run: >
          ./mvnw -B -DskipTests
          checkstyle:check
          -Dcheckstyle.config.location=${{ github.workspace }}/java_checks.xml