apiVersion: v1
kind: Namespace
metadata:
  name: mtdrworkshop
---
apiVersion: v1
kind: Service
metadata:
  name: todolistapp-springboot-service
  namespace: mtdrworkshop
spec:
  type: ClusterIP
  ports:
    - port: 80
      protocol: TCP
      targetPort: 8080
  selector:
    app: todolistapp-springboot
---
#this is new stuff for hosting on the load balancer
apiVersion: v1
kind: Service
metadata:
  name: todolistapp-backend-router
  namespace: mtdrworkshop
spec:
  selector:
    app: todolistapp-springboot
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolistapp-springboot-deployment
  namespace: mtdrworkshop
spec:
  selector:
    matchLabels:
      app: todolistapp-springboot
  replicas: 1
  template:
    metadata:
      labels:
        app: todolistapp-springboot
        version: v1
    spec:
      containers:
        - name: todolistapp-springboot
          image: mx-queretaro-1.ocir.io/axdispqrsjop/reacttodo/v7rzn/todolistapp-springboot:latest
          imagePullPolicy: Always
          env:
            - name: db_user
              value: "ADMIN"
            - name: db_url
              value: "jdbc:oracle:thin:@reacttodok7toc_tp?TNS_ADMIN=/mtdrworkshop/creds"
            - name: APP_CORS_ALLOWED_ORIGINS
              value: "*"
            - name: todo.table.name
              value: "todoitem"
            - name: driver_class_name
              value: "oracle.jdbc.OracleDriver"
            - name: OCI_REGION
              value: "mx-queretaro-1"
            - name: dbpassword
              valueFrom:
                secretKeyRef:
                  name: dbuser
                  key: dbpassword
                  optional: true
            - name: ui_username
              value: "admin"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-secret
                  key: TELEGRAM_BOT_TOKEN
            - name: GOOGLE_GENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-genai-secret
                  key: GOOGLE_GENAI_API_KEY
            - name: GOOGLE_GENAI_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-genai-secret
                  key: GOOGLE_GENAI_EMBEDDING_API_KEY
            - name: ui_password
              valueFrom:
                secretKeyRef:
                  name: frontendadmin
                  key: password
                  optional: true
          # [P7-DBG] backend bootstrap trace in pod logs
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "[P7-DBG][backend] pod=$(hostname) namespace=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo unknown)"
                    echo "[P7-DBG][backend] db_url=${db_url}"
                    echo "[P7-DBG][backend] APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}"
                    echo "[P7-DBG][backend] OCI_REGION=${OCI_REGION}"
                    case "${db_url}" in
                      *localhost* ) echo "[P7-DBG][backend] WARNING db_url still points to localhost" ;;
                    esac
          volumeMounts:
            - name: creds
              mountPath: /mtdrworkshop/creds
          ports:
            - containerPort: 8080
      restartPolicy: Always
      volumes:
        - name: creds
          secret:
            secretName: db-wallet-secret
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: todolistapp-springboot
---
apiVersion: v1
kind: Namespace
metadata:
  name: p7-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: p7frontend-service
  namespace: p7-frontend
  annotations:
    oci.oraclecloud.com/loadbalancer-policy: "IP_HASH"
    oci.oraclecloud.com/reserved-ips: "140.84.186.38"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local

  ports:
    - port: 80
      protocol: TCP
      targetPort: 3000
  selector:
    app: p7frontend
---
# this is new stuff for hosting on the load balancer
apiVersion: v1
kind: Service
metadata:
  name: p7frontend-router
  namespace: p7-frontend
spec:
  selector:
    app: p7frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p7frontend-deployment
  namespace: p7-frontend
spec:
  selector:
    matchLabels:
      app: p7frontend
  replicas: 1
  template:
    metadata:
      labels:
        app: p7frontend
        version: v1
    spec:
      imagePullSecrets:
        - name: oci-registry-secret
      containers:
        - name: p7frontend
          image: mx-queretaro-1.ocir.io/axdispqrsjop/equipo52/yv0fi/p7frontend:latest
          imagePullPolicy: Always
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "/api"
            - name: NODE_ENV
              value: "production"
          # [P7-DBG] frontend bootstrap trace in pod logs
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "[P7-DBG][frontend] pod=$(hostname) namespace=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo unknown)"
                    echo "[P7-DBG][frontend] NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
                    echo "[P7-DBG][frontend] BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL}"
                    echo "[P7-DBG][frontend] NODE_ENV=${NODE_ENV}"
                    case "${BACKEND_INTERNAL_URL}" in
                      *localhost* ) echo "[P7-DBG][frontend] WARNING backend URL is localhost; use the in-cluster service DNS in OCI" ;;
                    esac
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
      restartPolicy: Always
