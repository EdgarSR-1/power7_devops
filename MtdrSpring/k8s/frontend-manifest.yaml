apiVersion: v1
kind: Service
metadata:
  name: p7frontend-service
  namespace: p7-frontend
  annotations:
    oci.oraclecloud.com/loadbalancer-policy: "IP_HASH"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local

  ports:
    - port: 80
      protocol: TCP
      targetPort: 3000
  selector:
    app: p7frontend
---
# this is new stuff for hosting on the load balancer
apiVersion: v1
kind: Service
metadata:
  name: p7frontend-router
  namespace: p7-frontend
spec:
  selector:
    app: p7frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p7frontend-deployment
  namespace: p7-frontend
spec:
  selector:
    matchLabels:
      app: p7frontend
  replicas: 1
  template:
    metadata:
      labels:
        app: p7frontend
        version: v1
    spec:
      imagePullSecrets:
        - name: oci-registry-secret
      containers:
        - name: p7frontend
          image: mx-queretaro-1.ocir.io/axdispqrsjop/equipo52/yv0fi/p7frontend:latest
          imagePullPolicy: Always
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "/api"
            - name: BACKEND_INTERNAL_URL
              value: "http://todolistapp-backend-router.default.svc.cluster.local"
            - name: NODE_ENV
              value: "production"
          # [P7-DBG] frontend bootstrap trace in pod logs
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "[P7-DBG][frontend] pod=$(hostname) namespace=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo unknown)"
                    echo "[P7-DBG][frontend] NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
                    echo "[P7-DBG][frontend] BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL}"
                    echo "[P7-DBG][frontend] NODE_ENV=${NODE_ENV}"
                    case "${BACKEND_INTERNAL_URL}" in
                      *localhost* ) echo "[P7-DBG][frontend] WARNING backend URL is localhost; use the in-cluster service DNS in OCI" ;;
                    esac
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
      restartPolicy: Always
