spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.profiles.default=${SPRING_PROFILES_ACTIVE:oracle}

jwt.secret=${JWT_SECRET:yourSuperSecretKeyThatMustBeAtLeast32CharactersLong123}
jwt.expiration=86400000

logging.level.org.springframework.security=DEBUG

##Properties of UCP
# Database settings live in profile files:
# - application-oracle.properties
# - application-local.properties

##Logging properties for UCP
logging.level.root=INFO
logging.file.name=logs.log
logging.level.oracle.ucp=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.type=WARN

deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}

#spring.security.user.name=psong
#spring.security.user.password=WELcome__12345

telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.name=${TELEGRAM_BOT_NAME:}


