spring.jpa.database-platform=org.hibernate.community.dialect.Oracle12cDialect

# Oracle datasource (set these with env vars or here if needed)
# spring.datasource.url=jdbc:oracle:thin:@adbps_medium?TNS_ADMIN=/path/to/wallet
# spring.datasource.username=admin
# spring.datasource.password=secret

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.type=oracle.ucp.jdbc.PoolDataSource
spring.datasource.oracleucp.connection-factory-class-name=oracle.jdbc.pool.OracleDataSource
spring.datasource.oracleucp.sql-for-validate-connection=select * from dual
spring.datasource.oracleucp.connection-pool-name=connectionPoolName1
spring.datasource.oracleucp.initial-pool-size=2
spring.datasource.oracleucp.min-pool-size=2
spring.datasource.oracleucp.max-pool-size=10
app.bot.mode=llm
