apiVersion: v1
kind: Secret
metadata:
  name: dbuser
type: Opaque
data:
  # Reemplazar por valores base64 si se usa manifiesto directo
  dbuser: REPLACE_WITH_BASE64_DBUSER
  dbpassword: REPLACE_WITH_BASE64_DBPASSWORD

# Alternativa (no en manifiesto): crear localmente con kubectl:
# kubectl create secret generic dbuser --from-literal=dbuser=MY_DB_USER --from-literal=dbpassword=MY_DB_PASSWORD
